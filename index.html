<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人项目、论文、证书与经历展示网站">
  <title>林晓 · 个人主页</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="返回首页">LX</a>
    <nav aria-label="主导航">
      <a href="#profiles">主页</a>
      <a href="#work">工作</a>
      <a href="#education">教育</a>
      <a href="#projects">项目</a>
      <a href="#research">成果</a>
      <a href="#honors">荣誉</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-layout">
        <div class="hero-content">
          <p class="eyebrow">个人作品集 · PORTFOLIO</p>
          <h1>你好，我是<span id="profile-name">Zequan Yao</span>。</h1>
          <p class="hero-copy" id="profile-intro"></p>
          <div class="hero-actions">
            <a class="button primary" href="#profiles">了解更多</a>
            <a class="button secondary" id="email-link" href="mailto:zequanyao1@gmail.com">联系我</a>
          </div>
          <div class="hero-meta" id="profile-meta"></div>
        </div>
        <figure class="profile-photo-wrap">
          <img id="profile-photo" class="profile-photo" src="" alt="Zequan Yao 的个人照片">
        </figure>
      </div>
    </section>

    <section id="profiles" class="section split-section">
      <div>
        <p class="section-label">01 · 个人主页</p>
        <h2>在不同平台了解我</h2>
      </div>
      <div>
        <p id="about-text" class="large-copy"></p>
        <div id="profile-links" class="profile-links"></div>
      </div>
    </section>

    <section id="work" class="section">
      <div class="section-heading">
        <div><p class="section-label">02 · 工作经历</p><h2>专业实践</h2></div>
      </div>
      <div id="work-list" class="timeline"></div>
    </section>

    <section id="education" class="section">
      <div class="section-heading">
        <div><p class="section-label">03 · 教育背景</p><h2>学习经历</h2></div>
      </div>
      <div id="education-list" class="timeline"></div>
    </section>

    <section id="projects" class="section">
      <div class="section-heading">
        <div><p class="section-label">04 · 个人项目</p><h2>研究与实践项目</h2></div>
        <p>从研究到实践，保留过程，也展示结果。</p>
      </div>
      <div id="project-list" class="card-grid"></div>
    </section>

    <section id="research" class="section">
      <div class="section-heading">
        <div><p class="section-label">05 · 学术成果</p><h2>论文、专利与软件著作权</h2></div>
        <p>点击成果名称可查看首页或证书预览。</p>
      </div>
      <div id="research-filters" class="filter-row" aria-label="成果分类"></div>
      <div id="research-list" class="list-panel"></div>
    </section>

    <section id="honors" class="section">
      <div class="section-heading">
        <div><p class="section-label">06 · 个人荣誉</p><h2>荣誉与竞赛奖励</h2></div>
        <p>点击奖项名称可查看证书预览。</p>
      </div>
      <div id="honor-list" class="certificate-grid"></div>
    </section>
  </main>

  <footer>
    <p>© <span id="current-year"></span> <span id="footer-name"></span></p>
    <p>Built with care · Hosted on GitHub Pages</p>
  </footer>

  <dialog id="preview-dialog" aria-labelledby="preview-title">
    <div class="dialog-bar">
      <div><p class="section-label">图片预览</p><h3 id="preview-title"></h3></div>
      <button id="close-preview" class="icon-button" aria-label="关闭预览">×</button>
    </div>
    <img id="preview-image" alt="">
    <p id="preview-note" class="preview-note"></p>
  </dialog>

  <noscript>请启用 JavaScript 以查看网站内容。</noscript>
  <script src="assets/site.js"></script>
</body>
</html>
